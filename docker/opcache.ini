; Production OPcache tuning — the Docker image ships this extension disabled by
; default, so without this every request recompiles the entire Laravel
; framework + app code from source instead of reusing cached bytecode.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; The container image is rebuilt on every deploy and never mutated in place,
; so it's safe (and much faster) to skip the per-request filesystem
; stat/timestamp check that would otherwise invalidate the cache.
opcache.validate_timestamps=0
opcache.save_comments=1
