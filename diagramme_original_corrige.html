<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Diagramme de Cas d'Utilisation - Système LoméShop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    svg {
      background: #ffffff;
    }
  </style>
</head>
<body>

<svg width="850" height="1100" viewBox="0 0 850 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Main System Boundary Outer Frame -->
  <rect x="235" y="40" width="445" height="1000" fill="none" stroke="#000000" stroke-width="1.5"/>
  
  <!-- Top Gray Header Box -->
  <rect x="235" y="40" width="445" height="135" fill="#eaeaea" stroke="#000000" stroke-width="1.5"/>
  <text x="457" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">Système LoméShop</text>

  <!-- Dashed Line under header box -->
  <line x1="235" y1="175" x2="680" y2="175" stroke="#000000" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Top Ellipses inside Header -->
  <!-- S'inscrire / Créer un compte -->
  <ellipse cx="360" cy="98" rx="100" ry="18" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="360" y="102" text-anchor="middle" font-size="11" fill="#000000">S'inscrire / Créer un compte</text>

  <!-- Vérifier le rôle & permissions -->
  <ellipse cx="580" cy="98" rx="90" ry="18" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="580" y="102" text-anchor="middle" font-size="11" fill="#000000">Vérifier le rôle &amp; permissions</text>

  <!-- Se connecter (Login) -->
  <ellipse cx="457" cy="150" rx="145" ry="18" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="457" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Se connecter (Login)</text>

  <!-- Top Relations -->
  <!-- extend -->
  <path d="M 420,135 Q 390,120 375,116" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="390" y="122" font-size="9" text-anchor="middle">«extend»</text>

  <!-- include -->
  <path d="M 500,136 Q 535,120 550,115" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="535" y="122" font-size="9" text-anchor="middle">«include»</text>


  <!-- ==================== USE CASES (Ellipses) ==================== -->

  <!-- CLIENT USE CASES -->
  <ellipse cx="457" cy="210" rx="195" ry="17" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="457" y="214" text-anchor="middle" font-size="11" fill="#000000">Rechercher des produits &amp; boutiques sur carte</text>

  <ellipse cx="457" cy="255" rx="195" ry="17" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="457" y="259" text-anchor="middle" font-size="11" fill="#000000">Passer commande &amp; Payer (TMoney/Flooz/Carte)</text>

  <ellipse cx="457" cy="300" rx="195" ry="17" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="457" y="304" text-anchor="middle" font-size="11" fill="#000000">Suivre son livreur en temps réel (GPS Live)</text>

  <ellipse cx="457" cy="345" rx="195" ry="17" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="457" y="349" text-anchor="middle" fill="#000000" font-size="11">Fournir le code secret de livraison (4 chiffres)</text>

  <ellipse cx="457" cy="390" rx="195" ry="17" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="457" y="394" text-anchor="middle" font-size="11" fill="#000000">Évaluer les produits et le livreur (Avis)</text>

  <ellipse cx="457" cy="435" rx="195" ry="17" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="457" y="439" text-anchor="middle" font-size="11" fill="#000000">Communiquer par messagerie instantanée (Tchat)</text>


  <!-- LIVREUR USE CASES -->
  <ellipse cx="457" cy="495" rx="195" ry="17" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="457" y="499" text-anchor="middle" font-size="11" fill="#000000">Gérer sa disponibilité &amp; sa position GPS active</text>

  <ellipse cx="457" cy="540" rx="195" ry="17" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="457" y="544" text-anchor="middle" font-size="11" fill="#000000">Accepter une course &amp; naviguer via Google Maps</text>

  <ellipse cx="457" cy="585" rx="195" ry="17" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="457" y="589" text-anchor="middle" font-size="11" fill="#000000">Saisir le code secret pour finaliser la livraison</text>


  <!-- VENDEUR USE CASES (RE-POSITIONED CORRECTLY) -->
  <!-- Demander un retrait financier... is NOW associated to VENDEUR -->
  <ellipse cx="457" cy="630" rx="195" ry="17" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="457" y="634" text-anchor="middle" font-size="11" fill="#000000">Demander un retrait financier vers son Mobile Money</text>

  <ellipse cx="457" cy="685" rx="195" ry="17" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="457" y="689" text-anchor="middle" font-size="11" fill="#000000">Créer sa boutique &amp; soumettre ses fichiers KYC</text>

  <ellipse cx="457" cy="730" rx="195" ry="17" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="457" y="734" text-anchor="middle" font-size="11" fill="#000000">Gérer son catalogue de produits (CRUD &amp; Stock)</text>

  <ellipse cx="457" cy="775" rx="195" ry="17" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="457" y="779" text-anchor="middle" font-size="11" fill="#000000">Préparer les commandes &amp; gérer son solde (Wallet)</text>


  <!-- ADMIN USE CASES -->
  <ellipse cx="457" cy="835" rx="195" ry="17" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="457" y="839" text-anchor="middle" font-size="11" fill="#000000">Superviser la flotte de livreurs actifs sur carte</text>

  <ellipse cx="457" cy="880" rx="195" ry="17" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="457" y="884" text-anchor="middle" font-size="11" fill="#000000">Valider les documents KYC des boutiques</text>

  <ellipse cx="457" cy="925" rx="195" ry="17" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="457" y="929" text-anchor="middle" font-size="11" fill="#000000">Approuver et transférer les demandes de retraits</text>


  <!-- ==================== ACTORS ==================== -->

  <!-- ACTOR 1: Client (Acheteur) -->
  <g transform="translate(130, 310)">
    <circle cx="0" cy="-20" r="14" fill="none" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="-6" x2="0" y2="28" stroke="#000000" stroke-width="1.5"/>
    <line x1="-25" y1="8" x2="25" y2="8" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="28" x2="-18" y2="58" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="28" x2="18" y2="58" stroke="#000000" stroke-width="1.5"/>
    <text x="0" y="75" text-anchor="middle" font-size="11" font-weight="normal" fill="#000000">Client (Acheteur)</text>
  </g>

  <!-- ACTOR 2: Livreur (Prestige) -->
  <g transform="translate(130, 530)">
    <circle cx="0" cy="-20" r="14" fill="none" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="-6" x2="0" y2="28" stroke="#000000" stroke-width="1.5"/>
    <line x1="-25" y1="8" x2="25" y2="8" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="28" x2="-18" y2="58" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="28" x2="18" y2="58" stroke="#000000" stroke-width="1.5"/>
    <text x="0" y="75" text-anchor="middle" font-size="11" font-weight="normal" fill="#000000">Livreur (Prestige)</text>
  </g>

  <!-- ACTOR 3: Vendeur (Commerçant) -->
  <g transform="translate(130, 725)">
    <circle cx="0" cy="-20" r="14" fill="none" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="-6" x2="0" y2="28" stroke="#000000" stroke-width="1.5"/>
    <line x1="-25" y1="8" x2="25" y2="8" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="28" x2="-18" y2="58" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="28" x2="18" y2="58" stroke="#000000" stroke-width="1.5"/>
    <text x="0" y="75" text-anchor="middle" font-size="11" font-weight="normal" fill="#000000">Vendeur (Commerçant)</text>
  </g>

  <!-- ACTOR 4: Administrateur -->
  <g transform="translate(780, 865)">
    <circle cx="0" cy="-20" r="14" fill="none" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="-6" x2="0" y2="28" stroke="#000000" stroke-width="1.5"/>
    <line x1="-25" y1="8" x2="25" y2="8" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="28" x2="-18" y2="58" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="28" x2="18" y2="58" stroke="#000000" stroke-width="1.5"/>
    <text x="0" y="75" text-anchor="middle" font-size="11" font-weight="normal" fill="#000000">Administrateur</text>
  </g>


  <!-- ==================== LINES / CONNECTIONS ==================== -->

  <!-- Left Bus / Common Login Connections -->
  <line x1="190" y1="150" x2="190" y2="733" stroke="#000000" stroke-width="1"/>
  <line x1="190" y1="150" x2="312" y2="150" stroke="#000000" stroke-width="1"/>
  <line x1="155" y1="318" x2="190" y2="318" stroke="#000000" stroke-width="1"/>
  <line x1="155" y1="538" x2="190" y2="538" stroke="#000000" stroke-width="1"/>
  <line x1="155" y1="733" x2="190" y2="733" stroke="#000000" stroke-width="1"/>

  <!-- Right Bus / Admin Login Connection -->
  <line x1="602" y1="150" x2="780" y2="150" stroke="#000000" stroke-width="1"/>
  <line x1="780" y1="150" x2="780" y2="845" stroke="#000000" stroke-width="1"/>

  <!-- CLIENT CONNECTIONS -->
  <line x1="155" y1="318" x2="262" y2="210" stroke="#000000" stroke-width="1"/>
  <line x1="155" y1="318" x2="262" y2="255" stroke="#000000" stroke-width="1"/>
  <line x1="155" y1="318" x2="262" y2="300" stroke="#000000" stroke-width="1"/>
  <line x1="155" y1="318" x2="262" y2="345" stroke="#000000" stroke-width="1"/>
  <line x1="155" y1="318" x2="262" y2="390" stroke="#000000" stroke-width="1"/>
  <line x1="155" y1="318" x2="262" y2="435" stroke="#000000" stroke-width="1"/>

  <!-- LIVREUR CONNECTIONS (ONLY 3 LINES NOW) -->
  <line x1="155" y1="538" x2="262" y2="495" stroke="#000000" stroke-width="1"/>
  <line x1="155" y1="538" x2="262" y2="540" stroke="#000000" stroke-width="1"/>
  <line x1="155" y1="538" x2="262" y2="585" stroke="#000000" stroke-width="1"/>

  <!-- VENDEUR CONNECTIONS (NOW HAS 4 LINES INCLUDING DEMANDER UN RETRAIT) -->
  <line x1="155" y1="733" x2="262" y2="630" stroke="#000000" stroke-width="1"/> <!-- CONNECTED TO VENDEUR -->
  <line x1="155" y1="733" x2="262" y2="685" stroke="#000000" stroke-width="1"/>
  <line x1="155" y1="733" x2="262" y2="730" stroke="#000000" stroke-width="1"/>
  <line x1="155" y1="733" x2="262" y2="775" stroke="#000000" stroke-width="1"/>

  <!-- ADMIN CONNECTIONS -->
  <line x1="755" y1="865" x2="652" y2="835" stroke="#000000" stroke-width="1"/>
  <line x1="755" y1="865" x2="652" y2="880" stroke="#000000" stroke-width="1"/>
  <line x1="755" y1="865" x2="652" y2="925" stroke="#000000" stroke-width="1"/>

</svg>

</body>
</html>
